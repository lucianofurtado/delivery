<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="GIRO — Controle de Delivery">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16181C"/>
      <stop offset="1" stop-color="#0B0C0E"/>
    </linearGradient>
    <linearGradient id="brilho" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E11B22" stop-opacity=".35"/>
      <stop offset="1" stop-color="#E11B22" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" rx="22" fill="url(#fundo)"/>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="21.5" fill="none" stroke="#1E2126"/>

  <!-- Logo + nome -->
  <rect x="72" y="82" width="64" height="64" rx="16" fill="#E11B22"/>
  <text x="104" y="128" text-anchor="middle" font-family="'Archivo Black','Arial Black',Arial,sans-serif" font-size="34" font-weight="900" fill="#FFFFFF">G</text>
  <text x="156" y="130" font-family="'Archivo Black','Arial Black',Arial,sans-serif" font-size="46" font-weight="900" letter-spacing="-1.5" fill="#F4F4F5">GIRO</text>

  <text x="72" y="196" font-family="'Archivo Black','Arial Black',Arial,sans-serif" font-size="30" font-weight="900" letter-spacing="-0.6" fill="#F4F4F5">Controle de Delivery</text>
  <text x="72" y="232" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="18" fill="#8A8F98">Ganhos por plataforma, km, despesas, metas e manutenção</text>
  <text x="72" y="258" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="18" fill="#8A8F98">— tudo num só lugar, para quem roda de moto ou carro.</text>

  <!-- Mini gráfico de barras empilhadas -->
  <g transform="translate(760 64)">
    <rect x="-24" y="-16" width="400" height="224" rx="14" fill="#111316" stroke="#1E2126"/>
    <rect x="-24" y="80" width="400" height="128" fill="url(#brilho)" opacity=".25"/>
    <line x1="0" y1="62" x2="352" y2="62" stroke="#3DD68C" stroke-dasharray="6 6" opacity=".8"/>
    <line x1="0" y1="184" x2="352" y2="184" stroke="#1E2126"/>

    <g>
      <rect x="8"   y="80"  width="28" height="104" rx="4" fill="#E11B22"/>
      <rect x="52"  y="96"  width="28" height="88"  rx="4" fill="#E11B22"/>
      <rect x="96"  y="140" width="28" height="44"  rx="4" fill="#E11B22"/>
      <rect x="140" y="40"  width="28" height="144" rx="4" fill="#E11B22"/>
      <rect x="140" y="40"  width="28" height="34"  rx="4" fill="#F2A312"/>
      <rect x="184" y="110" width="28" height="74"  rx="4" fill="#E11B22"/>
      <rect x="184" y="110" width="28" height="30"  rx="4" fill="#F2A312"/>
      <rect x="228" y="70"  width="28" height="114" rx="4" fill="#E11B22"/>
      <rect x="228" y="70"  width="28" height="50"  rx="4" fill="#F2A312"/>
      <rect x="272" y="20"  width="28" height="164" rx="4" fill="#E11B22"/>
      <rect x="272" y="20"  width="28" height="70"  rx="4" fill="#F2A312"/>
      <rect x="272" y="20"  width="28" height="24"  rx="4" fill="#FFD100"/>
      <rect x="316" y="58"  width="28" height="126" rx="4" fill="#E11B22"/>
      <rect x="316" y="58"  width="28" height="40"  rx="4" fill="#FFD100"/>
    </g>

    <g font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#8A8F98">
      <rect x="0"   y="198" width="10" height="10" rx="2" fill="#E11B22"/><text x="16"  y="207">iFood</text>
      <rect x="70"  y="198" width="10" height="10" rx="2" fill="#F2A312"/><text x="86"  y="207">99Food</text>
      <rect x="146" y="198" width="10" height="10" rx="2" fill="#FFD100"/><text x="162" y="207">Keeta</text>
      <line x1="214" y1="203" x2="228" y2="203" stroke="#3DD68C" stroke-width="2"/><text x="234" y="207">meta diária</text>
    </g>
  </g>
</svg>
